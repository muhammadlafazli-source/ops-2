<style>
/* Layout: papan jadwal pelabuhan. Pemilih bahasa (ID/EN/KO) di header, strip sumber data, KPI, kartu kapal yang hampir tiba, peringatan, timeline, tabel semua kapal. */
:root{
  --bg:#e7ecee; --surface:#f6f9f9; --ink:#0f2230; --muted:#53687a; --line:#cbd6da;
  --accent:#d4562a; --ais:#1d5f8c; --ok:#23795c; --warn:#a96d12; --bad:#b3372f; --chip:#dde6e9;
  --display:"Barlow Condensed","Noto Sans KR","Arial Narrow",sans-serif; --body:"IBM Plex Sans","Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b151c; --surface:#111f29; --ink:#e5eef2; --muted:#93a8b4; --line:#243746;
  --accent:#f27d50; --ais:#62adde; --ok:#4fc095; --warn:#e2b24c; --bad:#f0827a; --chip:#192b37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b151c; --surface:#111f29; --ink:#e5eef2; --muted:#93a8b4; --line:#243746;
  --accent:#f27d50; --ais:#62adde; --ok:#4fc095; --warn:#e2b24c; --bad:#f0827a; --chip:#192b37; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,.num{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0}
html[lang="ko"] h1,html[lang="ko"] h2{letter-spacing:0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1;text-wrap:balance}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0}
.clock{text-align:right}
.clock .num{font-size:2.2rem;line-height:1}
.clock small{display:block;color:var(--muted);font-family:var(--mono);font-size:.72rem}
.fresh{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.chip{border:1px solid var(--line);background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.chip b{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip span{font-family:var(--mono);font-size:.82rem}
.chip i{font-style:normal;font-size:.76rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:12px 14px}
a.kpi{display:block;color:inherit;text-decoration:none;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
a.kpi:hover{border-color:var(--accent)}
a.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.kpi::after{content:"\2193";position:absolute;right:12px;top:10px;font-family:var(--mono);color:var(--muted)}
a.kpi:hover::after{color:var(--accent)}
.kpi .num{font-size:2.4rem;line-height:1}
section{scroll-margin-top:16px}
.globe{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:12px;align-items:start}
@media(max-width:860px){.globe{grid-template-columns:minmax(0,1fr)}}
.gl-stage{background:radial-gradient(120% 90% at 50% 0%,#0b2740 0%,#050f1b 62%);border:1px solid #17405c;padding:10px;min-width:0;color:#cfe6f3;box-shadow:0 12px 40px rgba(0,25,60,.35)}
.gl-stage .vsub,.gl-stage .legend{color:#9fc3d6}
.gl-stage .legend svg rect{stroke:#e8f6ff}
#glc{display:block;width:100%;aspect-ratio:1/1;max-height:660px;cursor:grab;touch-action:none}
#glc.drag{cursor:grabbing}
.gl-ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.gl-ctrl button{font:inherit;background:rgba(160,215,255,.08);color:#e3f3fc;border:1px solid rgba(140,205,255,.3);padding:5px 12px;cursor:pointer}
.gl-ctrl button:hover{background:rgba(160,215,255,.18)}
.gl-ctrl button[aria-pressed="true"]{background:#35c6ff;color:#03202f;border-color:#35c6ff}
.gl-ctrl button:focus-visible,.gl-item:focus-visible,.gl-time input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gl-time{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.gl-time input[type=range]{width:100%;accent-color:#35c6ff}
.gl-time .mono{color:#e3f3fc}
.gl-hint{margin:8px 0 0}
.gl-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.gl-list{display:flex;flex-direction:column;gap:6px;min-width:0}
@media(min-width:861px){.gl-list{max-height:560px;overflow-y:auto}}
.gl-item{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.gl-item:hover{border-color:var(--muted)}
.gl-item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.gl-item .dot{margin-right:6px}
.gl-note{font-size:.8rem;color:var(--muted)}
.jump{animation:jump 1.4s ease-out}
@keyframes jump{0%,35%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.jump{animation:none;outline:2px solid var(--accent)}a.kpi{transition:none}}
.kpi small{display:block;color:var(--muted);margin-top:4px}
.kpi.hot .num{color:var(--accent)}
h2{font-size:1.5rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-bottom:10px}
h2 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.vname{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1}
.vsub{color:var(--muted);font-size:.8rem}
.eta-big{text-align:right}
.eta-big .num{font-size:2rem;line-height:1;color:var(--accent)}
.eta-big small{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:4px}
.route .bar{position:relative;height:6px;background:var(--chip);border-radius:3px}
.route .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ais);border-radius:3px}
.route .bar em{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.route .ends{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);gap:8px}
.route .ends b{color:var(--ink);font-weight:600}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin:0}
dl div{min-width:0}
dt{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
dd{margin:0;font-family:var(--mono);font-size:.82rem}
dd s{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border:1px solid currentColor;border-radius:99px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.info{color:var(--ais)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);padding:9px 12px}
.alert.bad{border-left-color:var(--bad)}.alert.info{border-left-color:var(--ais)}
.alert .tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.alert b{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);padding:14px}
.scroll{overflow-x:auto}
svg text{fill:var(--ink);font-family:var(--body);font-size:11px}
svg .m{fill:var(--muted)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .now{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);max-width:100%}
.seg button{font:inherit;background:var(--surface);color:var(--ink);border:0;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lang button{padding:5px 12px;font-size:.82rem}
input[type=search]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:6px 10px;min-width:0;width:220px;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:980px;background:var(--surface)}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--chip)}
td .sub{display:block;color:var(--muted);font-size:.76rem}
td .nm{font-weight:600}
.notes{color:var(--muted);font-size:.84rem;display:flex;flex-direction:column;gap:5px;margin:0;padding-left:18px}
@media(max-width:520px){dl{grid-template-columns:1fr}.clock{text-align:left}.side{align-items:flex-start}}
.cg-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cg-k{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cg-k b{font-family:var(--display);font-size:2rem;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.cg-k span{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cg-k i{font-style:normal;font-size:.76rem;color:var(--muted)}
.cg-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
@media(max-width:900px){.cg-grid{grid-template-columns:minmax(0,1fr)}}
.cg-grid>*{min-width:0}
.cg-stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.cg-t td .vsub{display:inline}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.cg-h3{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.cg-t{min-width:0;width:100%}.cg-t th,.cg-t td{white-space:nowrap}.cg-t td.n,.cg-t th.n{text-align:right;font-variant-numeric:tabular-nums}
.cg-t tr.tot td{font-weight:600;background:var(--chip)}
.cg-bars{display:flex;flex-direction:column;gap:14px}
.cg-bg{display:flex;flex-direction:column;gap:5px}
.cg-bl{font-size:.8rem;color:var(--muted)}
.cg-br{display:grid;grid-template-columns:44px 1fr 64px;gap:8px;align-items:center;font-size:.82rem}
.cg-br .tr{height:14px;background:var(--chip)}
.cg-br .fl{height:100%;min-width:0}
.cg-br .v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.cg-m{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cg-plan{font-size:.84rem;color:var(--muted);margin:0}
.cg-d.pos{color:var(--warn)}.cg-d.neg{color:var(--bad)}.cg-d.zero{color:var(--ok)}
.hero{position:relative;border:1px solid var(--line);overflow:hidden;background:#061425;box-shadow:0 10px 30px rgba(6,20,37,.22)}
.hero-art{aspect-ratio:1200/290;width:100%}
.hero-art svg{display:block}
.hero-cap{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:#cfe3f1;background:rgba(6,20,37,.55);padding:3px 8px;border:1px solid rgba(160,215,255,.22)}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;padding:10px;background:#061425}
@media(min-width:760px){.hero-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hero-stats>div{background:rgba(6,20,37,.74);border:1px solid rgba(160,215,255,.26);padding:9px 12px;color:#e6f2f9;display:flex;flex-direction:column;gap:1px;min-width:0;backdrop-filter:blur(6px)}
.hero-stats span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#9fc3d6}
.hero-stats b{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.1;overflow-wrap:anywhere}
.hero-stats i{font-style:normal;font-size:.76rem;color:#b9d3e2;overflow-wrap:anywhere}
@media(max-width:600px){.hero-cap{position:static;display:block;border:0;border-top:1px solid rgba(160,215,255,.2);background:#061425;padding:6px 10px}}
.ship{animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wv1{animation:drift 16s linear infinite}.wv2{animation:drift 24s linear infinite reverse}
@keyframes drift{to{transform:translateX(-420px)}}
@media (prefers-reduced-motion:reduce){.ship,.wv1,.wv2{animation:none}}
.jumpnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:6px;overflow-x:auto;padding-block:8px;background:var(--bg);scrollbar-width:none}
.jumpnav::-webkit-scrollbar{display:none}
.jumpnav a{flex:none;white-space:nowrap;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.82rem}
.jumpnav a:hover{border-color:var(--accent);color:var(--accent)}
.jumpnav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
section{scroll-margin-top:60px}
h2{padding-bottom:6px;border-bottom:1px solid var(--line)}
.kpi{border-top:3px solid var(--ais)}.kpi.hot{border-top-color:var(--accent)}
.panel,.kpi,.chip,.gl-item,.cg-k{box-shadow:0 1px 2px rgba(15,34,48,.07)}
.cg-k{border-top:3px solid var(--accent)}
</style>

function alertsFor(now){
  var A=[],h=36e5;
  VESSELS.forEach(function(v){
    var n=esc(v.name+' '+v.voy), tm=esc(v.term.name);
    var nx=ms(v.next.eta);
    if(v.phase==='waiting_other'&&nx&&nx<now)
      A.push({sev:'bad',tag:S.tg.last,txt:S.a_last(n,esc(aisSt(v.ais.status).toLowerCase()),esc(areaT(v.ais.area)),dur((now-nx)/h),esc(pn(v.next)),dt(v.next.eta),esc(pn(v.last)),dt(v.last.atd))});
    if(v.phase==='enroute_jkt'){
      var te=ms(v.term.eta);
      if(te&&te<now)A.push({sev:'warn',tag:S.tg.web,txt:S.a_web(n,tm,dt(v.term.eta),dt(v.next.eta))});
      var ee=ms(v.jkt.eta),ae=ms(v.next.eta);
      if(ee&&ae&&Math.abs(ae-ee)>=6*h)A.push({sev:'warn',tag:S.tg.src,txt:S.a_src(n,dt(v.jkt.eta),dt(v.next.eta),dur((ae-ee)/h))});
      var tb=ms(v.term.berth),eb=ms(v.jkt.etb);
      if(tb&&eb&&Math.abs(tb-eb)>=6*h)A.push({sev:'info',tag:S.tg.etb,txt:S.a_etb(n,tm,dt(v.term.berth),dt(v.jkt.etb),dur((tb-eb)/h))});
      var cl=ms(v.term.closing);
      if(cl&&ae&&cl<ae)A.push({sev:'info',tag:S.tg.clo,txt:S.a_clo(n,tm,dt(v.term.closing),dt(v.next.eta))});
    }else{
      var tb2=ms(v.term.berth),eb2=ms(v.jkt.etb);
      if(tb2&&eb2&&Math.abs(tb2-eb2)>=6*h)A.push({sev:'warn',tag:S.tg.etb,txt:S.a_etb(n,tm,dt(v.term.berth),dt(v.jkt.etb),dur((tb2-eb2)/h))});
    }
    var aa=ms(v.ais.at);
    if(aa&&now-aa>4*h)A.push({sev:'info',tag:S.tg.ais,txt:S.a_ais(n,ago(v.ais.at,now))});
  });
  var em=ms(META.emailAt);

}

  c.addEventListener('pointermove',function(e){if(!G.drag)return;var dx=e.clientX-G.drag.x,dy=e.clientY-G.drag.y;G.drag.moved=Math.max(G.drag.moved,Math.abs(dx)+Math.abs(dy));
    var k=0.28/G.zoom;G.lon=G.drag.lon-dx*k;G.lat=Math.max(-80,Math.min(80,G.drag.lat+dy*k));glDraw()});
  c.addEventListener('pointerup',function(e){
    var d=G.drag;G.drag=null;c.classList.remove('drag');
    if(d&&d.moved<5){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)*(c.clientWidth/r.width),py=(e.clientY-r.top)*(c.clientWidth/r.width),best=null,bd=16;
      G.hits.forEach(function(h){var dd=Math.hypot(h.x-px,h.y-py);if(dd<bd){bd=dd;best=h}});
      if(best)glFocus(best.id);else{G.sel=null;glRender()}}
  });
  c.addEventListener('wheel',function(e){e.preventDefault();G.zoom=Math.max(0.8,Math.min(5,G.zoom*(e.deltaY<0?1.12:0.89)));glDraw()},{passive:false});
  document.getElementById('gl-zi').addEventListener('click',function(){G.zoom=Math.min(5,G.zoom*1.25);glDraw()});
  document.getElementById('gl-zo').addEventListener('click',function(){G.zoom=Math.max(0.8,G.zoom/1.25);glDraw()});
  document.getElementById('gl-rs').addEventListener('click',function(){G.lon=114;G.lat=6;G.zoom=1.0;G.sel=null;glRender()});
  document.getElementById('gl-play').addEventListener('click',function(){glPlay(!G.playing)});
  document.getElementById('gl-now').addEventListener('click',function(){glPlay(false);glSetOff(0)});
  document.getElementById('gl-t').addEventListener('input',function(e){glPlay(false);glSetOff(Number(e.target.value))});
  document.getElementById('gl-list').addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.gl-item');if(b)glFocus(b.getAttribute('data-id'))});
  document.getElementById('gl-spin').addEventListener('click',function(){G.spin=!G.spin;if(RM&&G.spin){G.timerSpin=setInterval(function(){if(G.spin)G.lon+=0.5;glDraw()},100)}glUI(Date.now())});
  try{new IntersectionObserver(function(en){G.vis=en[0].isIntersecting}).observe(c)}catch(e){}
  window.addEventListener('resize',function(){glDraw()});
  requestAnimationFrame(glLoop);
}

glInit();
document.getElementById('kpis').addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[data-go]');if(!a)return;
  var el=document.getElementById(a.getAttribute('data-go'));if(!el)return;
  e.preventDefault();
  var rm=false;try{rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(x){}
  el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
  el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');
  setTimeout(function(){el.classList.remove('jump')},1500);
});
setLang(pickLang(),false);
setInterval(renderAll,30000);
function startStatic(){
  var ok=function(r){if(!r.ok)throw new Error(r.status);return r.json()};
  var get=function(n){return fetch('data/'+n+'.json?t='+Date.now(),{cache:'no-store'}).then(ok)};
  function load(){
    Promise.all([get('vessels'),get('cargo'),get('meta')]).then(function(a){
      var v=a[0].filter(function(o){return o&&o.name&&o.jkt&&o.next&&o.last&&o.ais&&o.term});
      if(v.length)VESSELS=v;
      CARGO=a[1].filter(function(o){return o&&o.id&&o.discPlan});
      META=a[2];LIVE=true;renderAll();
    }).catch(function(){});
  }
  load();setInterval(load,60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
}
if(!(window.claude&&window.claude.use)){startStatic()}else try{
  window.claude.use('db').then(function(db){
    if(!db)return;
    db.collection('vessels').onSnapshot(function(s){
      if(s.empty)return;
      VESSELS=s.docs.map(function(d){var o=d.data();return o}).filter(function(o){return o&&o.name&&o.jkt&&o.next&&o.last&&o.ais&&o.term});
      LIVE=true;renderAll();
    },function(){});
    db.collection('cargo').onSnapshot(function(s){if(s.empty)return;CARGO=s.docs.map(function(d){return d.data()}).filter(function(o){return o&&o.id&&o.discPlan});renderAll()},function(){});
    db.doc('meta/status').onSnapshot(function(s){if(s.exists){META=s.data();renderAll()}},function(){});
  }).catch(function(){});
}catch(e){}
</script>
